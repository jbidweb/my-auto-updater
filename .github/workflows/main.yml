name: Scheduled Update

on:
  schedule:
    # 한국시간 기준 오전 10:10, 10:20, 10:30 ~ 저녁 09:10, 21:20, 21:30
    # UTC 기준 01:10, 01:20, 01:30 ~ 12:10, 12:20, 12:30
    - cron: '10 1-12 * * *'
    - cron: '20 1-12 * * *'
    - cron: '30 1-12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Run Updates
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. 한국 시간 정보 가져오기
          KST_TIME=$(TZ='Asia/Seoul' date +'%H:%M')
          
          # 2. '실제 실행된 시간'이 아니라 '예약된 분(Minute)' 정보 확인
          # GitHub Actions는 원래 실행되어야 할 cron 정보를 변수로 제공합니다.
          # 예: "10 1-12 * * *" 중 '10'을 추출
          SCHEDULED_MIN=$(echo "${{ github.event.schedule }}" | cut -d' ' -f1)
          
          # 만약 수동 실행(workflow_dispatch)했다면 현재 분을 기준으로 설정
          if [ -z "$SCHEDULED_MIN" ]; then
            SCHEDULED_MIN=$(TZ='Asia/Seoul' date +'%M')
          fi

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # 3. 예약된 '분'에 따라 타겟 고정 (지연 실행되어도 변하지 않음)
          if [ "$SCHEDULED_MIN" = "10" ]; then
            TARGET="https://jbidweb.com/jbupdate1.php"
            LABEL="1회차(10분 예약)"
          elif [ "$SCHEDULED_MIN" = "20" ]; then
            TARGET="https://jbidweb.com/jbupdate2.php"
            LABEL="2회차(20분 예약)"
          else
            TARGET="https://jbidweb.com/jbupdate3.php"
            LABEL="3회차(30분 예약)"
          fi

          # 4. 실제 요청
          RESULT=$(curl -sL -f -H "User-Agent: $USER_AGENT" "$TARGET" || echo "실패")
          REPORT=$(echo "$RESULT" | cut -c1-100 | sed 's/[&]/%26/g')
          
          # 5. 텔레그램 메시지 (예약 정보와 실제 실행 시각을 모두 표시)
          TEXT="🚀 *업데이트 완료 ($LABEL)*%0A✅ *대상:* $TARGET%0A✅ *예약시각:* ${SCHEDULED_MIN}분%0A✅ *실행시각:* $KST_TIME%0A📝 *결과:* $REPORT"
          
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            -d "parse_mode=Markdown" \
            -d "text=$TEXT"

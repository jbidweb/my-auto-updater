name: Scheduled Update

on:
  schedule:
    # 매일 실행 (요일 제한 1-5 제거)
    # UTC 01:10 ~ 12:30 사이 (한국시간 10:10 ~ 21:30)
    - cron: '10,20,30 1-12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Run Updates
        run: |
          # 서버 시간을 한국 시간(KST)으로 고정하여 계산
          # 이렇게 하면 UTC 지연과 상관없이 한국 시간 기준으로 로직이 돌아갑니다.
          KST_HOUR=$(date -d "+9 hours" +%H)
          KST_MIN=$(date -d "+9 hours" +%M)
          
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # '분' 단위를 기준으로 대상을 정하되, 
          # GitHub의 실행 지연(최대 10분 이상)을 고려하여 범위를 넉넉하게 잡았습니다.
          if [ "$KST_MIN" -ge 10 ] && [ "$KST_MIN" -lt 20 ]; then
            TARGET="https://jbidweb.com/jbupdate1.php"
          elif [ "$KST_MIN" -ge 20 ] && [ "$KST_MIN" -lt 30 ]; then
            TARGET="https://jbidweb.com/jbupdate2.php"
          else
            # 30분 예약이거나, 서버 지연으로 인해 30분 이후에 실행된 모든 경우
            TARGET="https://jbidweb.com/jbupdate3.php"
          fi
          
          # 실제 요청
          RESULT=$(curl -sL -H "User-Agent: $USER_AGENT" "$TARGET")
          REPORT=$(echo "$RESULT" | cut -c1-100)
          
          # 텔레그램 메시지 발송 (시간 정보를 한국 시간으로 명확히 표시)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=🚀 업데이트 완료!%0A✅ 대상: $TARGET%0A✅ 한국시각: ${KST_HOUR}:${KST_MIN}%0A📝 결과: $REPORT"

name: Scheduled Update

on:
  schedule:
    # 월~금요일, 한국 시간 오전 10시~오후 8시 실행
    - cron: '10,20,30 1-12 * * 1-5'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Run Updates
        run: |
          MIN=$(date +%M)
          # 업데이트 주소 클릭[cite: 1]
          if [ "$MIN" == "10" ]; then curl -s http://jbidweb.com/jbupdate1.php; fi
          if [ "$MIN" == "20" ]; then curl -s http://jbidweb.com/jbupdate2.php; fi
          if [ "$MIN" == "30" ]; then curl -s http://jbidweb.com/jbupdate3.php; fi
          
          # 텔레그램 메시지 발송 (아래 부분을 본인 정보로 수정하세요)
          # <토큰>과 <ID> 자리에 본인의 정보를 넣으세요.
          curl -s -X POST "https://api.telegram.org/bot8383632930:AAFe0Kc1arHJ6vcSN2JNui3DnvGXoCvGBnA/sendMessage" \
          -d "chat_id=8614039421&text=🚀 ${MIN}분 업데이트가 완료되었습니다!"

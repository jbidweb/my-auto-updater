name: Scheduled Update

on:
  schedule:
    # 한국 시간 오전 10시 ~ 오후 9시 (월~금 실행)
    - cron: '10,20,30 1-12 * * 1-5'
  workflow_dispatch: # 직접 실행 버튼 활성화

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Run Updates
        run: |
          # 1. 현재 몇 분인지 확인
          MIN=$(date +%M)
          
          # 2. 서버가 '진짜 사람'이라고 믿게 만드는 가짜 정보 (헤더)
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # 3. 시간대별 주소 호출 (보안 접속 https 사용 및 리다이렉트 자동 추적 -L 추가)
          if [ "$MIN" == "10" ]; then 
            RESULT=$(curl -sL -H "User-Agent: $USER_AGENT" "https://jbidweb.com/jbupdate1.php")
          elif [ "$MIN" == "20" ]; then 
            RESULT=$(curl -sL -H "User-Agent: $USER_AGENT" "https://jbidweb.com/jbupdate2.php")
          elif [ "$MIN" == "30" ]; then 
            RESULT=$(curl -sL -H "User-Agent: $USER_AGENT" "https://jbidweb.com/jbupdate3.php")
          else
            RESULT="예약된 시간이 아닙니다 ($MIN 분)"
          fi
          
          # 4. 텔레그램으로 결과 보고 (서버가 응답한 내용까지 포함해서 보냅니다)
          # 서버 응답(RESULT)이 너무 길면 오류가 날 수 있어 앞부분 50자만 잘라서 보냅니다.
          REPORT="${RESULT:0:50}"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=🚀 업데이트 실행 완료!%0A✅ 실행시각: $(date +'%H:%M') (${MIN}분)%0A📝 서버응답: ${REPORT}"

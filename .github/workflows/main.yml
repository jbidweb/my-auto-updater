name: Scheduled Update

on:
  schedule:
    # 한국 시간 오전 10시 ~ 오후 9시 (UTC 01~12시)
    - cron: '10,20,30 1-12 * * 1-5'
  workflow_dispatch: # 이 줄을 추가하면 지금 바로 수동 실행해볼 수 있습니다!

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Run Updates
        run: |
          MIN=$(date +%M)
          # 업데이트 주소 호출
          if [ "$MIN" == "10" ]; then curl -s http://jbidweb.com/jbupdate1.php; fi
          if [ "$MIN" == "20" ]; then curl -s http://jbidweb.com/jbupdate2.php; fi
          if [ "$MIN" == "30" ]; then curl -s http://jbidweb.com/jbupdate3.php; fi
          
          # 텔레그램 메시지 발송 (금고에 저장된 정보 사용)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=🚀 업데이트 완료! (현재 시간: $(date +'%H:%M'))"

name: Scheduled Update

on:
  schedule:
    # 한국 시간 오전 10시 ~ 오후 9시 (UTC 01~12시)
    - cron: '10,20,30 1-12 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Run Updates
        run: |
          MIN=$(date +%M)
          # '사람'이 사용하는 크롬 브라우저인 것처럼 속이는 헤더 정보입니다.
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # 업데이트 주소 호출 (User-Agent 추가)
          if [ "$MIN" == "10" ]; then curl -s -H "User-Agent: $USER_AGENT" http://jbidweb.com/jbupdate1.php; fi
          if [ "$MIN" == "20" ]; then curl -s -H "User-Agent: $USER_AGENT" http://jbidweb.com/jbupdate2.php; fi
          if [ "$MIN" == "30" ]; then curl -s -H "User-Agent: $USER_AGENT" http://jbidweb.com/jbupdate3.php; fi
          
          # 텔레그램 메시지 발송
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=🚀 DB 업데이트 완료! (분: $MIN, 시간: $(date +'%H:%M'))"

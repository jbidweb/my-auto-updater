name: Scheduled Update

on:
  schedule:
    # 월~금요일, 한국 시간 오전 10시~오후 8시 실행
    - cron: '10,20,30 1-11 * * 1-5'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Run Updates
        run: |
          MIN=$(date +%M)
          if [ "$MIN" == "10" ]; then curl -s http://jbidweb.com/jbupdate1.php; fi
          if [ "$MIN" == "20" ]; then curl -s http://jbidweb.com/jbupdate2.php; fi
          if [ "$MIN" == "30" ]; then curl -s http://jbidweb.com/jbupdate3.php; fi
